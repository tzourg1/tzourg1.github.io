<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>AeroMexico Video</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f9;
      color: #17253f;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(900px, 100%);
      background: #ffffff;
      border-radius: 18px;
      box-shadow: 0 16px 50px rgba(20, 38, 70, 0.14);
      overflow: hidden;
    }

    .heading {
      padding: 28px 28px 20px;
      text-align: center;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(1.45rem, 4vw, 2.1rem);
    }

    p {
      margin: 0;
      color: #53627a;
      line-height: 1.5;
    }

    .player {
      padding: 0 28px 30px;
    }

    video {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 600 / 252;
      background: #000;
      object-fit: cover;
      border-radius: 12px;
    }

    .note {
      padding: 16px 28px 24px;
      border-top: 1px solid #e7ebf1;
      text-align: center;
      font-size: 0.86rem;
      color: #718096;
    }

    @media (max-width: 520px) {
      body {
        padding: 0;
        background: #ffffff;
      }

      main {
        min-height: 100vh;
        border-radius: 0;
        box-shadow: none;
      }

      .heading,
      .player {
        padding-left: 16px;
        padding-right: 16px;
      }
    }
  </style>
</head>
<body>
  <main>
    <header class="heading">
      <h1>AeroMexico Video</h1>
      <p>Press play, then use the player’s volume control to hear the audio.</p>
    </header>

    <section class="player" aria-label="AeroMexico video player">
      <video
        controls
        playsinline
        preload="metadata"
        poster="https://demo.playable.video/xid_demo:6755360955695767.uid_web/lowsrc.jpg"
        controlslist="nodownload"
        disablepictureinpicture>
        <source src="https://demo.playable.video/xid_demo:6755360955695767.uid_web/native.m3u8" type="application/x-mpegURL">
        <source src="https://demo.playable.video/xid_demo:6755360955695767.uid_web/native.mp4" type="video/mp4">
        Your browser does not support embedded video.
      </video>
    </section>

    <footer class="note">Temporary video playback page.</footer>
  </main>
</body>
</html>
